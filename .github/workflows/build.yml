name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build phone and watch APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk murmur.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk murmur-watch.apk

      - uses: actions/upload-artifact@v4
        with:
          name: murmur-apks
          path: |
            murmur.apk
            murmur-watch.apk

      - name: Publish to Releases (direct download link for your phone)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Murmur build ${{ github.run_number }}
          files: |
            murmur.apk
            murmur-watch.apk
