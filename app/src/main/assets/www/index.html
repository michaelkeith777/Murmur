<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ShiftDeck</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="splash">
  <div class="splash-logo">
    <svg viewBox="0 0 96 96" width="112" height="112"><rect x="4" y="4" width="88" height="88" rx="26" fill="#FF6200"/><rect x="22" y="26" width="52" height="46" rx="9" fill="#fff"/><rect x="22" y="26" width="52" height="13" rx="6" fill="#4D148C"/><path d="M33 18v14M63 18v14" stroke="#fff" stroke-width="7" stroke-linecap="round"/><path class="splash-check" d="M35 55l9 9 17-18" fill="none" stroke="#4D148C" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <div class="splash-name">Shift<span>Deck</span></div>
  <div class="splash-sub">Your work day, sorted.</div>
</div>

<div id="app">
  <main id="view"></main>
  <button id="fab" class="rip" data-act="fab" aria-label="Add"></button>
  <nav class="tabs" id="tabs">
    <div class="ind" id="ind"></div>
    <button data-act="tab" data-v="today" class="rip"><span class="ti"></span><b>Today</b></button>
    <button data-act="tab" data-v="calendar" class="rip"><span class="ti"></span><b>Calendar</b></button>
    <button data-act="tab" data-v="tasks" class="rip"><span class="ti"></span><b>To-Do</b></button>
    <button data-act="tab" data-v="more" class="rip"><span class="ti"></span><b>More</b></button>
  </nav>
</div>

<div id="sheetWrap"><div class="backdrop" data-act="closeSheet"></div><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<canvas id="fx"></canvas>
<script src="app.js"></script>
</body>
</html>
