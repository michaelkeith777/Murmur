name: Build APK

on:
  push:
    branches: [shiftdeck]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ShiftDeck.apk

      - uses: actions/upload-artifact@v4
        with:
          name: shiftdeck-apk
          path: ShiftDeck.apk

      - name: Publish to Releases (direct download link for your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: shiftdeck-${{ github.run_number }}
          name: ShiftDeck build ${{ github.run_number }}
          make_latest: false
          target_commitish: shiftdeck
          files: ShiftDeck.apk
