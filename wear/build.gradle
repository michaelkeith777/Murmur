plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zelvari.murmur'
    compileSdk 35

    defaultConfig {
        applicationId 'com.zelvari.murmur.wear'
        minSdk 30
        targetSdk 34
        versionCode 24
        versionName '1.9.6'
    }

    // The keyboard, AI client and settings keys are shared by the phone and watch apps.
    sourceSets {
        main {
            java.srcDirs += ['../shared/java']
        }
    }

    // One fixed key for every build, so a new APK installs over the old one.
    signingConfigs {
        murmur {
            storeFile rootProject.file('murmur.jks')
            storePassword 'murmur1'
            keyAlias 'murmur'
            keyPassword 'murmur1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.murmur
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.murmur
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
